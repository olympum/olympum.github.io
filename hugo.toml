baseURL = "https://www.olympum.com/"
locale = "en-us"
title = "Bruno's Journal"
# Using custom layouts - no theme

[pagination]
  pagerSize = 10

# Permalinks
[permalinks]
  posts = "/posts/:slug/"

[params]
  author = "Bruno Fernandez-Ruiz"
  description = "CTO by week, composer by weekend, triathlete by obsession"


# Main menu
[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "categories"
  name = "Categories"
  url = "/categories/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 40

[outputs]
  home = ["HTML", "RSS"]

# Markdown settings
[markup]
  [markup.highlight]
    style = "dracula"
    lineNos = false
    codeFences = true
    guessSyntax = true

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true  # Allow HTML in markdown (needed for some legacy posts)
    [markup.goldmark.extensions]
      [markup.goldmark.extensions.passthrough]
        enable = true
        [markup.goldmark.extensions.passthrough.delimiters]
          block = [["\\[", "\\]"], ["$$", "$$"]]
          inline = [["\\(", "\\)"], ["$", "$"]]

# Taxonomies
[taxonomies]
  category = "categories"
  tag = "tags"

# Build settings
[build]
  writeStats = true

# Minify output
[minify]
  disableXML = true
  minifyOutput = true
